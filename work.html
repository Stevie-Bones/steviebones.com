			<script>
				(function() {
					var galleryRoot = document.getElementById('work-gallery');
					var images = [];
					var overlay = document.getElementById('gallery-overlay');
					var overlayImage = document.getElementById('gallery-overlay-image');
					var caption = document.getElementById('gallery-overlay-caption');
					var currentIndex = 0;
					var imageBaseName = 'Picture_';
					var imageExtension = '.jpg';

					function padNumber(number) {
						return String(number).padStart(3, '0');
					}

					function createGalleryItem(image, index) {
						var item = document.createElement('div');
						item.className = 'gallery-item';
						item.dataset.index = String(index);

						var img = document.createElement('img');
						img.src = image.src;
						img.alt = image.alt;
						item.appendChild(img);

						item.addEventListener('click', function() {
							updateOverlay(index);
						});

						return item;
					}

					function renderGallery() {
						galleryRoot.innerHTML = '';
						images.forEach(function(image, index) {
							galleryRoot.appendChild(createGalleryItem(image, index));
						});
					}

					function buildImageList(index) {
						return {
							src: 'images/' + imageBaseName + padNumber(index) + imageExtension,
							alt: 'Work image ' + padNumber(index)
						};
					}

					function loadImages(index) {
						var probe = new Image();
						probe.onload = function() {
							images.push(buildImageList(index));
							loadImages(index + 1);
						};
						probe.onerror = function() {
							renderGallery();
						};
						probe.src = buildImageList(index).src;
					}

					function updateOverlay(index) {
						currentIndex = (index + images.length) % images.length;
						overlayImage.src = images[currentIndex].src;
						overlayImage.alt = images[currentIndex].alt;
						caption.textContent = (currentIndex + 1) + ' / ' + images.length;
						overlay.classList.add('active');
						document.body.classList.add('gallery-open');
					}

					function closeOverlay() {
						overlay.classList.remove('active');
						document.body.classList.remove('gallery-open');
					}

					document.getElementById('gallery-close').addEventListener('click', closeOverlay);
					document.getElementById('gallery-prev').addEventListener('click', function(event) {
						event.stopPropagation();
						updateOverlay(currentIndex - 1);
					});
					document.getElementById('gallery-next').addEventListener('click', function(event) {
						event.stopPropagation();
						updateOverlay(currentIndex + 1);
					});

					overlay.addEventListener('click', function(event) {
						if (event.target === overlay) {
							closeOverlay();
						}
					});

					document.addEventListener('keydown', function(event) {
						if (!overlay.classList.contains('active')) return;
						if (event.key === 'Escape') closeOverlay();
						if (event.key === 'ArrowLeft') updateOverlay(currentIndex - 1);
						if (event.key === 'ArrowRight') updateOverlay(currentIndex + 1);
					});

					loadImages(1);
				})();
			</script>
